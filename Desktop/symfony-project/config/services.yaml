# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    env(SENDER_EMAIL): 'contact@mentis.com'
    env(GROQ_API_KEY): ''
    env(GEMINI_API_KEY): ''
    google_maps_api_key: '%env(GOOGLE_MAPS_API_KEY)%'
    gemini_api_key: '%env(GEMINI_API_KEY)%'
    app_secret: '%env(APP_SECRET)%'
    app_public_base_url: '%env(APP_PUBLIC_BASE_URL)%'
    sender_email: '%env(SENDER_EMAIL)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            $senderEmail: '%env(SENDER_EMAIL)%'
            $groqApiKey: '%env(GROQ_API_KEY)%'
            $spotifyClientId: '%env(SPOTIFY_CLIENT_ID)%'
            $spotifyClientSecret: '%env(SPOTIFY_CLIENT_SECRET)%'
            $clientId: '%env(SPOTIFY_CLIENT_ID)%'
            $clientSecret: '%env(SPOTIFY_CLIENT_SECRET)%'
            $geminiApiKey: '%env(GEMINI_API_KEY)%'
            $appBaseUrl: '%env(APP_BASE_URL)%'
            $appPublicBaseUrl: '%env(APP_PUBLIC_BASE_URL)%'
            $appSecret: '%env(APP_SECRET)%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Specific configurations for services that might need manual wiring or tags
    App\Service\EmailManager:
        autowire: true

    App\Service\GoalAIService:
        autowire: true

    App\Service\GoalQrCodeService:
        autowire: true

    App\Service\SpotifyService:
        autowire: true

    App\Service\QRCodeService:
        arguments:
            $urlGenerator: '@router.default'

    App\Service\EmailNotificationService:
        arguments:
            $mailer: '@mailer.mailer'
            $qrCodeService: '@App\Service\QRCodeService'

    App\Service\GoogleMapsService:
        arguments:
            $apiKey: '%env(GOOGLE_MAPS_API_KEY)%'

    App\Service\AIChatService:
        arguments:
            $httpClient: '@http_client'

    App\Service\FaceRecognitionService:
        arguments:
            $projectDir: '%kernel.project_dir%'